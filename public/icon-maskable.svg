<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Same mark as icon.svg, pulled into the central 80% so a circular or
       rounded mask cannot clip the tiles. -->
  <rect width="512" height="512" fill="#f7f7f5"/>
  <g>
    <rect x="116" y="116" width="130" height="130" fill="#6aaa64"/>
    <text x="181" y="181" fill="#ffffff" font-family="Helvetica, Arial, sans-serif"
      font-size="91" font-weight="700" text-anchor="middle" dominant-baseline="central">W</text>
    <rect x="266" y="116" width="130" height="130" fill="#787c7e"/>
    <rect x="116" y="266" width="130" height="130" fill="#c9b458"/>
    <rect x="269" y="269" width="124" height="124" fill="none" stroke="#d3d6da" stroke-width="6"/>
  </g>
</svg>
